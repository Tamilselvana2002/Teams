{% extends 'base.html' %}

{% block title %}Register Host Account — Teams{% endblock %}

{% block content %}
<div class="auth-wrapper" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 120px); padding: 24px;" data-testid="page-register">
  <div class="card-glass" style="max-width: 440px; width: 100%;">
    <div style="text-align: center; margin-bottom: 28px;">
      <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 8px;">Create Host Account</h2>
      <p style="color: var(--text-secondary); font-size: 14px;">Sign up as a host to launch, schedule, and moderate video meetings.</p>
    </div>

    <form method="POST" action="{% url 'host_register' %}">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-input" 
          placeholder="choose_username"
          data-testid="input-reg-username"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-input" 
          placeholder="you@example.com"
          data-testid="input-reg-email"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          placeholder="At least 6 characters"
          data-testid="input-reg-password"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password_confirm">Confirm Password</label>
        <input 
          type="password" 
          id="password_confirm" 
          name="password_confirm" 
          class="form-input" 
          placeholder="Confirm password"
          data-testid="input-reg-password-confirm"
          required
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;" data-testid="btn-register-submit">
        Create Host Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-secondary);">
      Already have an account? 
      <a href="{% url 'host_login' %}">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
