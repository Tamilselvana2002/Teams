{% extends 'base.html' %}

{% block title %}Sign In — Teams{% endblock %}

{% block content %}
<div class="auth-wrapper" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 120px); padding: 24px;" data-testid="page-login">
  <div class="card-glass" style="max-width: 420px; width: 100%;">
    <div style="text-align: center; margin-bottom: 28px;">
      <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 8px;">Host Sign In</h2>
      <p style="color: var(--text-secondary); font-size: 14px;">Sign in to create persistent meeting rooms and manage calls.</p>
    </div>

    <form method="POST" action="{% url 'host_login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="username">Username or Email</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-input" 
          placeholder="your_username or you@example.com"
          data-testid="input-login-username"
          required
          autofocus
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          placeholder="••••••••"
          data-testid="input-login-password"
          required
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;" data-testid="btn-login-submit">
        Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-secondary);">
      Don't have a host account? 
      <a href="{% url 'host_register' %}" data-testid="link-to-register">Register as Host</a>
    </div>
  </div>
</div>
{% endblock %}
