# ==============================================================================
# Nginx Configuration for Teams Platform & Multi-App Setup
# Path on server: /etc/nginx/sites-available/teams.conf
# ==============================================================================

# 1. Upstream cluster definition
upstream teams_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name teams.yourdomain.com;

    client_max_body_size 50M;

    # Static Assets Cache
    location /static/ {
        alias /var/www/teams/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Media Uploads (if any)
    location /media/ {
        alias /var/www/teams/media/;
        expires 7d;
        access_log off;
    }

    # Reverse Proxy to Daphne (HTTP + WebSocket)
    location / {
        proxy_pass http://teams_backend;
        proxy_http_version 1.1;

        # WebSocket support headers (CRITICAL for WebRTC signaling & In-Call Chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket long-polling timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }
}
