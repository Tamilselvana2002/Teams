# ==============================================================================
# Master Nginx Reverse Proxy Configuration for 5 Django Applications
# File location on AWS server: /etc/nginx/sites-available/5-django-apps.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# APPLICATION 1: Teams (Django Channels + WebSockets) -> Port 8000
# URL: https://teams.yourdomain.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name teams.yourdomain.com;
    client_max_body_size 50M;

    # Static files served directly by Nginx (Fast!)
    location /static/ {
        alias /var/www/app1/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/app1/media/;
        expires 7d;
        access_log off;
    }

    # Pass web and WebSocket traffic to Daphne on Port 8000
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket headers (Crucial for video/chat signaling)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}

